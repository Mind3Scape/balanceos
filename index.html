<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<!-- maximum-scale=1 stops iOS from auto-zooming the page when an input is focused
     (the "site zooms in when the keyboard opens" bug). interactive-widget=resizes-content
     makes the on-screen keyboard push content up (bottom composer rises above it) like a
     native app, instead of overlaying it. -->
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>BalanceOS</title>

<!-- Installable full-screen iOS web app -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="BalanceOS">
<meta name="theme-color" content="#05070f">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">

<!-- Open the TCP+TLS handshakes to the cold-start origins early. telegram.org serves
     the Mini App SDK (classic script → no crossorigin); the Supabase project is hit by
     CORS fetches on first sync (→ crossorigin so the warmed connection is reused). -->
<link rel="preconnect" href="https://telegram.org">
<link rel="preconnect" href="https://vnkjsqvtgybqlfnhdijf.supabase.co" crossorigin>

<!-- Telegram Mini App SDK — runs only when opened inside Telegram; deferred so it
     never blocks the normal web/PWA launch, and a no-op if telegram.org is blocked. -->
<script src="https://telegram.org/js/telegram-web-app.js" defer></script>
<script src="telegram.js?v=v802" defer></script>

<!-- OpenRouter key for the live AI chat (set in aikey.js; empty = canned demo replies).
     defer → preserves document order (runs before cloud.js) without blocking the parser. -->
<script src="aikey.js?v=v802" defer></script>

<!-- Yandex Maps key for the Community partners map (public client-side key, restrict by domain). -->
<script src="mapkey.js?v=v562" defer></script>

<!-- Supabase connection (public URL + anon key; empty = local-only mode). -->
<script src="supabase.js?v=v802" defer></script>

<link rel="stylesheet" href="styles.css?v=v802">
<link rel="stylesheet" href="mobile.css?v=v802">
</head>
<body>

<!-- Launch screen: a calm light wash (matches onboarding's background), painted
     instantly while the JS loads. No orb/text here on purpose — the app's own
     cinematic intro animates in over it, so there's nothing to cross-fade against
     and no first-second flicker. -->
<div id="splash"></div>

<div id="root"></div>

<script src="vendor/react.production.min.js" defer></script>
<script src="vendor/react-dom.production.min.js" defer></script>

<!-- Native iOS haptics: invisible switch overlay → real Taptic tick on every tap -->
<script src="haptics.js?v=v802" defer></script>

<!-- Local-first persistence (the data spine). Defines window.bosStore before the
     app boots; the cloud (Supabase) later plugs in behind the same has/load/save. -->
<script src="store.js?v=v802" defer></script>

<!-- Supabase JS client — VENDORED locally (pinned @2.108.2) so a cold start never blocks
     on jsDelivr (this audience is often on networks where the CDN is slow or blocked); it
     now lives under /vendor → served cache-first by the SW. + BalanceOS cloud layer (T1).
     The app is local-first and works fully without these; cloud syncs on top when signed in. -->
<script src="vendor/supabase-2.108.2.umd.js" defer></script>
<script src="cloud.js?v=v802" defer></script>

<!-- Precompiled UI — plain JS built from the .jsx sources by scripts/build.js.
     defer on every tag → they download in PARALLEL instead of one-at-a-time parser-blocking,
     while keeping execution order (these are position-ordered globals). No Babel Standalone
     (saves ~3 MB) and ZERO in-browser compilation → fast load.
     Rebuild before deploy:  node scripts/build.js  -->
<script src="build/components/icons.js?v=v802" defer></script>
<script src="build/components/shell.js?v=v802" defer></script>
<!-- core/ — neutral shared toolkit (both demos + live use these single copies) -->
<script src="build/core/aliases.js?v=v802" defer></script>
<script src="build/core/confetti.js?v=v802" defer></script>
<script src="build/core/home-kit.js?v=v802" defer></script>
<script src="build/core/habits-kit.js?v=v802" defer></script>
<script src="build/core/profile-kit.js?v=v802" defer></script>
<script src="build/core/community-kit.js?v=v802" defer></script>
<script src="build/core/extra-kit.js?v=v802" defer></script>
<!-- demo product screens (frozen). home / habits / community are LAZY-loaded on first
     demo-or-fresh entry (loadDemoBundle in shell.jsx) → ~370 KB off the live cold start.
     profile + extra stay loaded: they expose symbols the LIVE app itself uses
     (SignUpScreen / OnboardingScreen for onboarding, bosAiBrief / AchievementUnlock). -->
<script src="build/screens/demo/profile.js?v=v802" defer></script>
<script src="build/screens/demo/extra.js?v=v802" defer></script>
<script src="build/screens/intro.js?v=v802" defer></script>
<!-- live-only forks of the mode-aware bricks (load before the live screens) -->
<script src="build/screens/live/economy_live.js?v=v802" defer></script>
<script src="build/screens/live/shared_live.js?v=v802" defer></script>
<script src="build/screens/live/home_live.js?v=v802" defer></script>
<script src="build/screens/live/habits_live.js?v=v802" defer></script>
<script src="build/screens/live/profile_live.js?v=v802" defer></script>
<script src="build/screens/live/community_live.js?v=v802" defer></script>
<script src="build/screens/live/circle_room_live.js?v=v802" defer></script>
<script src="build/screens/live/habit_standard_live.js?v=v802" defer></script>
<script src="build/screens/live/home_extra_live.js?v=v802" defer></script>
<script src="build/screens/live/habits_extra_live.js?v=v802" defer></script>
<script src="build/screens/live/profile_extra_live.js?v=v802" defer></script>
<script src="build/screens/live/community_extra_live.js?v=v802" defer></script>
<script src="build/screens/live/extra_live.js?v=v802" defer></script>
<script src="build/app.js?v=v802" defer></script>

<script>
  // Register the service worker for offline + instant relaunch, and AUTO-UPDATE
  // so a new deploy reaches installed / Telegram instances. The worker
  // skipWaiting()s + clients.claim()s; here we reload once it takes control, and
  // periodically re-check sw.js. Guarded so the very first registration (initial
  // claim) doesn't reload, and so it never loops.
  if ("serviceWorker" in navigator) {
    if (navigator.serviceWorker.controller) {
      let refreshing = false;
      navigator.serviceWorker.addEventListener("controllerchange", () => {
        if (refreshing) return;
        refreshing = true;
        window.location.reload();
      });
    }
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("sw.js").then((reg) => {
        reg.update();
        setInterval(() => reg.update(), 60000);
      }).catch(() => {});
    });
  }
</script>
</body>
</html>
