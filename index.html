<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<!-- maximum-scale=1 stops iOS from auto-zooming the page when an input is focused
     (the "site zooms in when the keyboard opens" bug). interactive-widget=resizes-content
     makes the on-screen keyboard push content up (bottom composer rises above it) like a
     native app, instead of overlaying it. -->
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>BalanceOS</title>

<!-- Installable full-screen iOS web app -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="BalanceOS">
<meta name="theme-color" content="#05070f">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">

<!-- Telegram Mini App SDK — runs only when opened inside Telegram; deferred so it
     never blocks the normal web/PWA launch, and a no-op if telegram.org is blocked. -->
<script src="https://telegram.org/js/telegram-web-app.js" defer></script>
<script src="telegram.js" defer></script>

<!-- OpenRouter key for the live AI chat (set in aikey.js; empty = canned demo replies). -->
<script src="aikey.js"></script>

<!-- Supabase connection (public URL + anon key; empty = local-only mode). -->
<script src="supabase.js"></script>

<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="mobile.css">
</head>
<body>

<!-- Launch screen: a calm light wash (matches onboarding's background), painted
     instantly while the JS loads. No orb/text here on purpose — the app's own
     cinematic intro animates in over it, so there's nothing to cross-fade against
     and no first-second flicker. -->
<div id="splash"></div>

<div id="root"></div>

<script src="vendor/react.production.min.js"></script>
<script src="vendor/react-dom.production.min.js"></script>

<!-- Native iOS haptics: invisible switch overlay → real Taptic tick on every tap -->
<script src="haptics.js"></script>

<!-- Local-first persistence (the data spine). Defines window.bosStore before the
     app boots; the cloud (Supabase) later plugs in behind the same has/load/save. -->
<script src="store.js"></script>

<!-- Supabase JS client + BalanceOS cloud layer (T1). The app is local-first and works
     fully without these; the cloud syncs on top when configured + signed in. -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="cloud.js"></script>

<!-- Precompiled UI — plain JS built from the .jsx sources by scripts/build.js.
     No Babel Standalone (saves ~3 MB) and ZERO in-browser compilation → fast load.
     Rebuild before deploy:  node scripts/build.js  -->
<script src="build/components/icons.js?v=v183"></script>
<script src="build/components/shell.js?v=v183"></script>
<script src="build/screens/home.js?v=v183"></script>
<script src="build/screens/habits.js?v=v183"></script>
<script src="build/screens/community.js?v=v183"></script>
<script src="build/screens/profile.js?v=v183"></script>
<script src="build/screens/extra.js?v=v183"></script>
<script src="build/screens/intro.js?v=v183"></script>
<script src="build/app.js?v=v183"></script>

<script>
  // Register the service worker for offline + instant relaunch, and AUTO-UPDATE
  // so a new deploy reaches installed / Telegram instances. The worker
  // skipWaiting()s + clients.claim()s; here we reload once it takes control, and
  // periodically re-check sw.js. Guarded so the very first registration (initial
  // claim) doesn't reload, and so it never loops.
  if ("serviceWorker" in navigator) {
    if (navigator.serviceWorker.controller) {
      let refreshing = false;
      navigator.serviceWorker.addEventListener("controllerchange", () => {
        if (refreshing) return;
        refreshing = true;
        window.location.reload();
      });
    }
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("sw.js").then((reg) => {
        reg.update();
        setInterval(() => reg.update(), 60000);
      }).catch(() => {});
    });
  }
</script>
</body>
</html>
