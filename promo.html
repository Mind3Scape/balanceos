<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>BalanceOS — promo</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: #dce6f4; }
  .promo {
    width: 1280px; height: 1000px; position: relative; overflow: hidden;
    display: flex; flex-direction: column; align-items: center;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", system-ui, sans-serif;
    background:
      radial-gradient(55% 46% at 50% 14%, rgba(150,224,228,0.20), transparent 70%),
      radial-gradient(130% 95% at 50% 10%, #eef3fc 0%, #e4ebf6 44%, #dae4f3 100%);
  }
  .glow {
    position: absolute; width: 720px; height: 720px; left: 280px; top: 8px;
    border-radius: 50%; pointer-events: none;
    background: radial-gradient(circle, rgba(122,164,208,0.40), rgba(150,162,236,0.15) 42%, transparent 64%);
    filter: blur(34px);
  }
  header { text-align: center; margin-top: 34px; position: relative; z-index: 2; }
  .orb {
    width: 58px; height: 58px; border-radius: 50%; margin: 0 auto 14px;
    background:
      radial-gradient(42% 38% at 70% 30%, rgba(150,224,228,0.5), transparent 60%),
      radial-gradient(46% 44% at 28% 72%, rgba(150,162,236,0.46), transparent 62%),
      radial-gradient(circle at 37% 29%, #ffffff 0%, #dbe6f6 14%, #7aa4d0 46%, #3f5f86 72%, #243b5c 100%);
    box-shadow: 0 10px 28px rgba(122,164,208,0.5), inset -5px -7px 15px rgba(20,32,56,0.5), inset 5px 5px 13px rgba(255,255,255,0.34);
  }
  .wm { font-size: 40px; font-weight: 600; letter-spacing: 0.4px; color: #15233c; }
  .wm b { font-weight: 800; }
  .tag { font-size: 18px; font-weight: 400; color: rgba(21,35,60,0.56); margin-top: 9px; letter-spacing: 0.1px; }
  .phones { display: flex; gap: 44px; align-items: flex-end; margin-top: 30px; position: relative; z-index: 2; }
  .phone {
    padding: 10px; border-radius: 46px; background: linear-gradient(165deg, #20232b 0%, #0a0a0e 100%);
    box-shadow: 0 40px 84px rgba(40,62,112,0.28), 0 9px 24px rgba(0,0,0,0.18);
  }
  /* True iPhone screen aspect: 375×812 (≈19.5:9). The app is 375-wide; scale it
     to the frame width so each phone shows the full screen at real proportions. */
  .phone .screen { width: 282px; height: 611px; border-radius: 40px; overflow: hidden; position: relative; background: #eef3fc; }
  .phone .screen iframe { width: 375px; height: 812px; border: 0; transform: scale(0.752); transform-origin: top left; }
  .phone.hero { transform: translateY(-16px); }
  .phone.hero .screen { width: 300px; height: 650px; }
  .phone.hero .screen iframe { width: 375px; height: 812px; transform: scale(0.8); }
  .glass { position: absolute; inset: 0; border-radius: 40px; box-shadow: inset 0 0 0 2px rgba(255,255,255,0.06); pointer-events: none; }
  .foot { margin-top: 30px; text-align: center; position: relative; z-index: 2; }
  .pills { display: flex; gap: 11px; justify-content: center; }
  .pills span { background: rgba(255,255,255,0.72); border: 1px solid rgba(21,35,60,0.07); color: #2f5e96; font-size: 14.5px; font-weight: 500; padding: 9px 17px; border-radius: 999px; box-shadow: 0 3px 10px rgba(120,150,200,0.13); }
  .link { margin-top: 16px; font-size: 14.5px; color: rgba(21,35,60,0.46); letter-spacing: 0.2px; }
</style>
</head>
<body>
<div class="promo">
  <div class="glow"></div>
  <header>
    <div class="orb"></div>
    <div class="wm"><b>Balance</b>OS</div>
    <div class="tag">Ты видишь мир таким, в каком состоянии находишься</div>
  </header>
  <div class="phones">
    <div class="phone"><div class="screen"><iframe src="index.html?screen=intro" scrolling="no"></iframe><div class="glass"></div></div></div>
    <div class="phone hero"><div class="screen"><iframe src="index.html?screen=home" scrolling="no"></iframe><div class="glass"></div></div></div>
    <div class="phone"><div class="screen"><iframe src="index.html?screen=community" scrolling="no"></iframe><div class="glass"></div></div></div>
  </div>
  <div class="foot">
    <div class="pills"><span>Не трекер, а платформа</span><span>Привычки вместе с близкими</span><span>Команды и тренинги</span><span>Цели и ИИ-помощник</span></div>
    <div class="link">mind3scape.github.io/balanceos</div>
  </div>
</div>
</body>
</html>
